name: Engine update check

# package.json and scripts/whisper-runtime.json pin the stable engine and its artifacts.
# 이 워크플로가 월 1회 업스트림 최신 릴리스를 확인하고, 새 버전이 있으면
# 실제 음성 추출 테스트를 돌린 뒤 결과를 담은 PR을 연다.
# 머지 여부는 사람이 결정한다 — 검증 없이 엔진이 바뀌는 일은 없다.

on:
  schedule:
    - cron: '17 3 3 * *' # 매월 3일 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: windows-latest
    steps:
      - name: Checkout
        # zizmor: ignore[artipacked] the later git push needs checkout credentials; this job uploads no artifacts
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Compare pinned engine with upstream latest
        id: compare
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $pinned = (Get-Content package.json -Raw | ConvertFrom-Json).whisperCppVersion
          $releases = gh api 'repos/ggml-org/whisper.cpp/releases?per_page=100' | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot query upstream releases' }
          $stable = $releases | Where-Object {
            -not $_.prerelease -and -not $_.draft -and $_.tag_name -match '^v\d+\.\d+\.\d+$'
          } | Sort-Object { [version]$_.tag_name.Substring(1) } -Descending | Select-Object -First 1
          if (-not $stable) { throw 'No stable semantic-version release found' }
          $latest = $stable.tag_name
          Write-Host "pinned=$pinned latest=$latest"
          "pinned=$pinned" >> $env:GITHUB_OUTPUT
          "latest=$latest" >> $env:GITHUB_OUTPUT
          if ([version]$pinned.Substring(1) -ge [version]$latest.Substring(1)) {
            Write-Host "Engine is up to date."
            "update=false" >> $env:GITHUB_OUTPUT
          } else {
            $existing = gh pr list --state open --head "engine-update/$latest" --json number --jq length
            if ($existing -gt 0) {
              Write-Host "PR for $latest already open."
              "update=false" >> $env:GITHUB_OUTPUT
            } else {
              "update=true" >> $env:GITHUB_OUTPUT
            }
          }

      - name: Transcription test with the new engine
        if: steps.compare.outputs.update == 'true'
        id: transcribe
        shell: pwsh
        env:
          LATEST_TAG: ${{ steps.compare.outputs.latest }}
        run: |
          $tag = $env:LATEST_TAG
          Invoke-WebRequest -UseBasicParsing -OutFile engine.zip `
            -Uri "https://github.com/ggml-org/whisper.cpp/releases/download/$tag/whisper-bin-x64.zip"
          Expand-Archive engine.zip -DestinationPath engine-test -Force
          $cli = (Get-ChildItem -Recurse -Filter whisper-cli.exe engine-test | Select-Object -First 1).FullName
          Invoke-WebRequest -UseBasicParsing -OutFile ggml-tiny.bin `
            -Uri "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.bin"
          # whisper-cli는 진행 상황을 stderr로 쓴다 — Stop이면 정상 실행도 죽는다.
          $ErrorActionPreference = 'Continue'
          & $cli -m ggml-tiny.bin -f nya.wav -osrt -of engine-check -l en 2>&1 | Out-Null
          $code = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'
          $ok = ($code -eq 0) -and (Test-Path "engine-check.srt") -and `
            ((Get-Content "engine-check.srt" -Raw) -match '\d+:\d{2}:\d{2},\d{3} --> ')
          $result = if ($ok) { 'PASS' } else { 'FAIL (exit=' + $code + ')' }
          "result=$result" >> $env:GITHUB_OUTPUT
          Write-Host "transcription: $result"

      - name: Open the engine bump PR
        if: steps.compare.outputs.update == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PINNED_VERSION: ${{ steps.compare.outputs.pinned }}
          LATEST_TAG: ${{ steps.compare.outputs.latest }}
          TRANSCRIPTION_RESULT: ${{ steps.transcribe.outputs.result }}
        run: |
          $pinned = $env:PINNED_VERSION
          $latest = $env:LATEST_TAG
          $release = gh api "repos/ggml-org/whisper.cpp/releases/tags/$latest" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $release.prerelease -or $release.draft) { throw 'Expected a stable release' }
          $commit = gh api "repos/ggml-org/whisper.cpp/commits/$latest" --jq .sha
          if ($LASTEXITCODE -ne 0 -or $commit -notmatch '^[0-9a-f]{40}$') { throw 'Invalid source commit' }
          $manifest = Get-Content scripts/whisper-runtime.json -Raw | ConvertFrom-Json
          foreach ($name in @($manifest.windowsAssets.PSObject.Properties.Name)) {
            $asset = $release.assets | Where-Object name -eq $name
            if (-not $asset -or $asset.digest -notmatch '^sha256:[0-9a-f]{64}$') { throw "Missing verified asset: $name" }
            $manifest.windowsAssets.$name.size = $asset.size
            $manifest.windowsAssets.$name.sha256 = $asset.digest.Substring(7)
          }
          $manifest.version = $latest
          $manifest.sourceCommit = $commit
          $manifest | ConvertTo-Json -Depth 10 | Set-Content scripts/whisper-runtime.json
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $pkg.whisperCppVersion = $latest
          $pkg | ConvertTo-Json -Depth 20 | Set-Content package.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "engine-update/$latest"
          git add package.json scripts/whisper-runtime.json
          git commit -m "chore(engine): bump whisper.cpp $pinned -> $latest"
          git push origin "engine-update/$latest"
          $lines = @(
            'Automated engine update check.',
            '',
            '| Check | Result |',
            '| --- | --- |',
            "| Transcription (nya.wav, tiny model) | $env:TRANSCRIPTION_RESULT |",
            '',
            "Upstream release notes: https://github.com/ggml-org/whisper.cpp/releases/tag/$latest",
            '',
            'Merging this PR changes which engine the next release bundles. The release',
            'workflow will re-verify it with a real transcription.'
          )
          Set-Content -Path pr-body.md -Value ($lines -join "`n")
          gh pr create --title "chore(engine): whisper.cpp $pinned -> $latest" `
            --body-file pr-body.md --head "engine-update/$latest" --base main
